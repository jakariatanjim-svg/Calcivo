apply plugin: 'com.android.application'

/*
 * Version information is injected at build time:
 *
 *   ./gradlew assembleDebug -PappVersionName=1.4 -PappVersionCode=10400
 *
 * `npm run apk` and the GitHub Actions workflow both pass the version computed
 * by scripts/version.mjs. Environment variables and finally a plain default are
 * used as fallbacks, so a bare `./gradlew assembleDebug` still works.
 */
def appVersionName = project.findProperty("appVersionName") ?: System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
def appVersionCode = (project.findProperty("appVersionCode") ?: System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()

/*
 * Release signing. Provide a keystore through gradle properties or environment
 * variables (ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
 * ANDROID_KEY_PASSWORD). Without a keystore the release variant is signed with
 * the debug key so the APK stays installable on any device.
 */
def keystorePath = project.findProperty("keystorePath") ?: System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = project.findProperty("keystorePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keystoreAlias = project.findProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
def keystoreAliasPassword = project.findProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")

// A relative keystore path may be given from the app module or from the
// repository root, so both are checked before falling back.
def releaseKeystore = null
if (keystorePath != null && !keystorePath.trim().isEmpty()) {
    def candidates = [
        file(keystorePath),
        rootProject.file(keystorePath),
        new File(rootProject.projectDir.parentFile, keystorePath),
    ]
    releaseKeystore = candidates.find { it != null && it.exists() }
}
def hasReleaseKeystore = releaseKeystore != null

if (keystorePath != null && !hasReleaseKeystore) {
    logger.warn("Keystore '${keystorePath}' was not found - the release build falls back to the debug key.")
}

android {
    namespace = "io.github.jakariatanjim.calcivo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.jakariatanjim.calcivo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile releaseKeystore
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreAliasPassword
            }
        }
    }
    buildTypes {
        developer {
            // Development APK, produced by the "developer" workflow input: a
            // plain, debuggable build that installs straight on a phone.
            //
            // `matchingFallbacks` is what makes this custom build type work at
            // all. The Capacitor modules only ship the standard `debug` and
            // `release` variants, so the app has to say which one its own build
            // type stands for. Without it Gradle stops with
            //   "No matching variant of project :capacitor-android was found"
            // because it cannot pick a variant of the libraries to link against.
            matchingFallbacks = ['debug']

            // Signed with the debug key on purpose: Android refuses to install
            // an unsigned APK, and a build type without a signing config is also
            // written as `app-developer-unsigned.apk`, which the build scripts
            // and the workflow collect as `app-developer.apk`.
            debuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            // Standard build type - the libraries resolve through their own
            // `release` variant, which is the default match.
            matchingFallbacks = ['release']
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // No keystore configured: sign with the debug key so the APK still installs.
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
